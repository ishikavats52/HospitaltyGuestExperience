name: Deploy Hospitality Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update code and restart backend
        run: |
          cd /home/ubuntu/HospitaltyGuestExperience
          git fetch origin main
          git reset --hard origin/main
          cd backend
          npm ci --omit=dev
          pm2 restart hospitality-backend
          pm2 save
